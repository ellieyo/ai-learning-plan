<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Learning Plan</title>
<style>
:root{--bg:#fff;--ink:#16160f;--mute:#6f6c64;--line:#e3e0d9;--zebra:#faf9f6;
 --accent:#2f5d50;--sep:#f2f0ea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:8px;padding:14px 16px;flex-wrap:wrap}
.bar h1{margin:0 12px 0 0;font-size:15px;font-weight:680;letter-spacing:-.01em;white-space:nowrap}
select,input[type=search]{font:inherit;font-size:12px;padding:3px 7px;border:1px solid var(--line);
 border-radius:5px;background:var(--bg);color:var(--ink);max-width:190px}
select:focus,input:focus{outline:none;border-color:var(--accent)}
input[type=search]{min-width:200px}
.count{margin-left:auto;font-size:11.5px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-right:4px}
.tabs button{font:inherit;font-size:12px;font-weight:600;background:var(--bg);border:0;
 border-right:1px solid var(--line);color:var(--mute);padding:4px 12px;cursor:pointer;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button .n{opacity:.6;margin-left:5px;font-weight:500;font-variant-numeric:tabular-nums}
.lnk{font-size:11.5px;color:var(--mute);background:none;border:0;cursor:pointer;padding:0;font-family:inherit}
.lnk:hover{color:var(--ink);text-decoration:underline}

table{border-collapse:collapse;width:100%;table-layout:fixed}
thead th{position:sticky;top:49px;z-index:20;background:var(--bg);text-align:left;
 font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:670;
 padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.35;font-size:9px;margin-left:3px}
thead th.s .ar{opacity:1;color:var(--accent)}
thead th.s{color:var(--ink)}
tbody td{padding:0 9px;border-bottom:1px solid var(--sep);vertical-align:middle;
 height:31px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr.wk td{background:#f4f2ec;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--mute);font-weight:670;height:26px;padding:0 9px;border-bottom:1px solid var(--line)}
tbody tr.wk.now td{background:var(--accent);color:#fff}
tbody tr.r:hover td{background:#eef3f1}
td.dt{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}
td.tm{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute);font-size:11.5px}
td.ti{font-weight:400}
td.ti .vb{color:var(--mute)}
td.ti b{font-weight:600}
td.ti a{display:inline}
td.og a{display:block;overflow:hidden;text-overflow:ellipsis}
td.og,td.lo,td.hr{color:var(--mute);font-size:12px}
td.og a{color:var(--mute)}
td.og a:hover{color:var(--accent)}
td.no{color:var(--mute);font-size:11.5px;cursor:pointer}
tr.open td{height:auto;padding:6px 9px;vertical-align:top}
tr.open td.no{white-space:normal;line-height:1.4}
tr.open td.ti{white-space:normal;line-height:1.35}
td.no:hover{color:var(--ink)}
td.ty{font-size:11.5px;color:var(--mute);white-space:nowrap}
td.hh{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;
 color:var(--ink);font-weight:560;white-space:nowrap}
td.hh.z{color:#c3bfb6;font-weight:400}
td.hh[title]{cursor:help}
.pf{color:var(--accent);font-weight:700;margin-left:1px}
th.rt{text-align:right}
.tot{font-size:11.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.tot b{color:var(--ink);font-weight:670}
.tot .sepd{margin:0 5px;opacity:.4}

.st{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.02em;
 padding:1.5px 7px;border-radius:4px;white-space:nowrap}
.st-completed{background:#e2efe4;color:#2b6437}
.st-accepted{background:#cfe6d5;color:#1f5a2c}
.st-registered{background:#cfe6d5;color:#1f5a2c}
.st-inprogress{background:#fbeed2;color:#835811}
.st-interviewing{background:#fbeed2;color:#835811}
.st-worktest{background:#fbeed2;color:#835811}
.st-toapply{background:#eeece7;color:#67645c}
.st-scheduled{background:#e2eaf6;color:#2c4f80}
.st-applied{background:#e9e2f4;color:#553b92}
.st-notstarted{background:#eeece7;color:#67645c}
.st-notaccepted{background:#f8e0dc;color:#8e392c}
.st-rejected{background:#f8e0dc;color:#8e392c}
.st-missed{background:#f8e0dc;color:#8e392c}
.st-closed{background:#f8e0dc;color:#8e392c}

.empty{padding:44px;text-align:center;color:var(--mute)}
footer{padding:14px 16px 40px;font-size:11px;color:var(--mute)}
code{background:var(--zebra);padding:1px 4px;border-radius:3px;font-size:10.5px}
@media(max-width:900px){table{table-layout:auto}.hide-s{display:none}}
thead th:nth-child(2),td.tm{display:none}
#tabC{display:none}
</style></head><body>

<div class="bar">

  <select id="fType"></select>

  <input type="search" id="q" placeholder="Search&hellip;">

  <span class="count" id="count"></span>

</div>

</tr></thead>
<tbody id="tb"></tbody>
</table>

<footer id="foot"></footer>

pe": "Course", "Location": "Online", "Hours": "40", "PrepHours": "", "PrepDetail": "", "BaseNote": "", "Notes": "", "week": "", "Total": "40", "NotesFull": ""}, {"Date": "", "EndDate": "", "Time": "", "Status": "Scheduled", "Title": "Attend Responsible AI Foundations Professional Certificate", "TitleV": "Attend ", "TitleMain": "Responsible AI Foundations Professional Certificate", "Organization": "All Tech Is Human (LinkedIn Learning)", "OrgURL": "https://alltechishuman.org/", "URL": "https://www.linkedin.com/learning/paths/responsible-ai-foundations-professional-certificate-by-all-tech-is-human", "Type": "Course", "Location": "Online", "Hours": "3", "PrepHours": "", "PrepDetail": "", "BaseNote": "", "Notes": "", "week": "", "Total": "3", "NotesFull": ""}, {"Date": "", "EndDate": "", "Time": "", "Status": "To Apply", "Title": "Attend Short course on AGI Safety", "TitleV": "Attend ", "TitleMain": "Short course on AGI Safety", "Organization": "Google DeepMind", "OrgURL": "https://deepmind.google/", "URL": "https://deepmindsafetyresearch.medium.com/introducing-our-short-course-on-agi-safety-1072adb7912c", "Type": "Course", "Location": "Online", "Hours": "2", "PrepHours": "", "PrepDetail": "", "BaseNote": "", "Notes": "", "week": "", "Total": "2", "NotesFull": ""}, {"Date": "", "EndDate": "", "Time": "", "Status": "To Apply", "Title": "Consultant / expert database listing", "TitleV": "", "TitleMain": "Consultant / expert database listing", "Organization": "Hollywood, Health & Society", "OrgURL": "https://hollywoodhealthandsociety.org/", "URL": "https://hollywoodhealthandsociety.org/", "Type": "Consulting", "Location": "Online", "Hours": "3", "PrepHours": "", "PrepDetail": "", "BaseNote": "", "Notes": "", "week": "", "Total": "3", "NotesFull": ""}];
const TODAY=new Date().toISOString().slice(0,10);
const MONDAY=(()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));
  // local date components, NOT toISOString: UTC rollover pushed the current week
  // into Completed every evening PT (Elizabeth item 18, fixed 2026-08-03)
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z]/g,"");
const day=s=>{const d=new Date(s+"T12:00:00");
  return M[d.getMonth()]+" "+d.getDate()+" \u00b7 "+["Su","Mo","Tu","We","Th","Fr","Sa"][d.getDay()];};
const wkLabel=s=>{const a=new Date(s+"T12:00:00"),b=new Date(s+"T12:00:00");b.setDate(b.getDate()+6);
  return "Week of "+M[a.getMonth()]+" "+a.getDate()+" \u2013 "+
    (a.getMonth()===b.getMonth()?"":M[b.getMonth()]+" ")+b.getDate()+", "+a.getFullYear();};

let TAB="upcoming", sortK="Date", sortAsc=true, userSorted=false;
const F={time:"all",type:"",stat:"",q:""};
// Current week counts as upcoming, completed items included.
const isPast    = r => r.Date && r.week < MONDAY;
const isReading = r => r.Type==="Reading";
const inTab = r => TAB==="reading"   ? isReading(r)
                 : TAB==="completed" ? (!isReading(r) && isPast(r))
                                     : (!isReading(r) && !isPast(r));

function opts(id,label,vals){
  document.getElementById(id).innerHTML=`<option value="">${label}</option>`+
    vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
}
function refreshOpts(){
  const pool=DATA.filter(inTab);
  const t=F.type,st=F.stat;
  opts("fType","All types",[...new Set(pool.map(r=>r.Type))].sort());
  opts("fStat","All statuses",[...new Set(pool.map(r=>r.Status))].sort());
  fType.value=[...new Set(pool.map(r=>r.Type))].includes(t)?t:"";  F.type=fType.value;
  fStat.value=[...new Set(pool.map(r=>r.Status))].includes(st)?st:""; F.stat=fStat.value;
}
refreshOpts();
document.getElementById("nA").textContent=DATA.filter(r=>!isReading(r)&&!isPast(r)).length;
document.getElementById("nB").textContent=DATA.filter(r=>!isReading(r)&&isPast(r)).length;
document.getElementById("nC").textContent=DATA.filter(isReading).length;

function match(r){
  if(!inTab(r))return false;
  if(F.type&&r.Type!==F.type)return false;
  if(F.stat&&r.Status!==F.stat)return false;
  if(F.q){const h=(r.Title+" "+r.Organization+" "+r.NotesFull+" "+r.Location+" "+r.Type+" "+r.Status).toLowerCase();
    if(!h.includes(F.q))return false;}
  return true;
}

function row(r,i){
  const end=r.EndDate&&r.EndDate!==r.Date;
  const dt=r.Date?(end?day(r.Date)+" &ndash; "+M[new Date(r.EndDate+"T12:00:00").getMonth()]+" "+
                   new Date(r.EndDate+"T12:00:00").getDate():day(r.Date)):"&mdash;";
  const main=`<b>${esc(r.TitleMain)}</b>`;
  const ti=`<span class="vb">${esc(r.TitleV)}</span>`+
    (r.URL?`<a href="${esc(r.URL)}" target="_blank" rel="noopener">${main}</a>`:main);
  return `<tr class="r" data-i="${i}">
    <td class="dt">${dt}</td>
    <td class="tm">${esc(r.Time)||"&ndash;"}</td>
    <td><span class="st st-${slug(r.Status)}">${esc(r.Status)}</span></td>
    <td class="ty">${esc(r.Type)}</td>
    <td class="ti" title="${esc(r.Title)}">${ti}</td>
    <td class="og" title="${esc(r.Organization)}">${r.OrgURL?`<a href="${esc(r.OrgURL)}" target="_blank" rel="noopener">${esc(r.Organization)}</a>`:esc(r.Organization)}</td>
    <td class="lo hide-s" title="${esc(r.Location)}">${esc(r.Location)}</td>
    <td class="hh${r.Total?"":" z"}"${r.PrepDetail?` title="${esc(r.Hours)}h scheduled + ${esc(r.PrepHours)}h prep &#10;&#10;${esc(r.PrepDetail).replace(/; /g,"&#10;")}"`:""}>${
      r.Total?esc(r.Total):"&ndash;"}${r.PrepHours?'<span class="pf">+</span>':""}</td>
    <td class="no hide-s" title="click to expand">${esc(r.NotesFull)}</td></tr>`;
}

function render(){
  let rows=DATA.filter(match);
  if(!userSorted){ sortK="Date"; sortAsc = (TAB==="upcoming"); }
  const dir=sortAsc?1:-1;
  rows.sort((a,b)=>{
    if(sortK==="Hours"){
      const x=a.Total===""?-1:parseFloat(a.Total), y=b.Total===""?-1:parseFloat(b.Total);
      return x!==y ? (x<y?-dir:dir) : (a.Date<b.Date?-1:1);
    }
    let x=a[sortK]||"",y=b[sortK]||"";
    if(sortK==="Date"){ if(!x)return 1; if(!y)return -1; }   // undated always last
    return x<y?-dir:x>y?dir:(a.Date<b.Date?-1:1);
  });

  let html="",lastWk=null;
  const byDate = (sortK==="Date");
  rows.forEach((r,i)=>{
    if(byDate){
      const w=r.week||"__none__";
      if(w!==lastWk){
        html+=`<tr class="wk${r.week===MONDAY?" now":""}"><td colspan="9">`+
              (r.week?wkLabel(r.week):"No date set")+`</td></tr>`;
        lastWk=w;
      }
    }
    html+=row(r,DATA.indexOf(r));
  });
  document.getElementById("tb").innerHTML=html||
    `<tr><td colspan="9" class="empty">Nothing matches those filters.</td></tr>`;
  document.getElementById("count").textContent=rows.length+" of "+DATA.filter(inTab).length;
  const DONE=["Completed","In progress"], AHEAD=["Scheduled","Registered","Accepted"];
  const sum=ss=>rows.reduce((t,r)=>t+(r.Total&&ss.includes(r.Status)?parseFloat(r.Total):0),0);
  const n=x=>Number(x.toFixed(2)).toLocaleString();
  const done=sum(DONE), ahead=sum(AHEAD), miss=rows.filter(r=>!r.Total).length;
  document.getElementById("tot").innerHTML=
    `<b>${n(done)}</b> hrs done` + (ahead?`<span class="sepd">|</span><b>${n(ahead)}</b> hrs booked`:"") +
    (miss?`<span class="sepd">|</span>${miss} unlogged`:"");
  document.querySelectorAll("thead th").forEach(th=>{
    th.classList.toggle("s",th.dataset.k===sortK);
    const ar=th.querySelector(".ar"); if(ar)ar.innerHTML=(th.dataset.k===sortK&&!sortAsc)?"&#9660;":"&#9650;";
  });
}

document.querySelectorAll("thead th").forEach(th=>th.addEventListener("click",()=>{
  const k=th.dataset.k;
  if(k===sortK)sortAsc=!sortAsc; else {sortK=k;sortAsc=true;}
  userSorted=true; render();
}));
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab; userSorted=false;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  refreshOpts(); render();
});
document.getElementById("fType").onchange=e=>{F.type=e.target.value;render();};
document.getElementById("fStat").onchange=e=>{F.stat=e.target.value;render();};
document.getElementById("q").oninput=e=>{F.q=e.target.value.toLowerCase();render();};
document.getElementById("reset").onclick=()=>{
  F.type="";F.stat="";F.q="";userSorted=false;q.value="";refreshOpts();render();};
document.getElementById("tb").addEventListener("click",e=>{
  const td=e.target.closest("td.no"); if(td)td.parentElement.classList.toggle("open");});

render();
document.getElementById("foot").innerHTML=
  "Upcoming holds the current week and everything after it. Completed holds earlier weeks, newest first. "+
  "Hours is the total for that row. A + means prep time is folded in. Totals respond to the filters. "+
  "To Apply = not yet applied for. "+
  "Click a column header to sort. Click a note to expand that row and see clipped text in full. "+
  "Built Aug 6, 2026.";
</script></body></html>
